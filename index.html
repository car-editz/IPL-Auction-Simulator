<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Auction Night — Fantasy Cricket Auction Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0b1016;
  --bg-1:#111926;
  --bg-2:#161f2e;
  --bg-3:#1d2a3d;
  --line:#26344a;
  --line-soft:#1c2839;
  --gold:#e2b04a;
  --gold-soft:#f0cf85;
  --crimson:#c8483a;
  --crimson-soft:#e2685a;
  --pitch:#4f8f68;
  --pitch-soft:#79c79a;
  --text-0:#f2f4f7;
  --text-1:#aeb9c9;
  --text-2:#77879c;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --disp:'Barlow Condensed',sans-serif;
  --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 700px at 15% -10%, #16233a 0%, var(--bg-0) 55%), var(--bg-0);
  color:var(--text-0);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;display:flex;flex-direction:column;}
::selection{background:var(--gold);color:#1a1200;}
button{font-family:var(--body);cursor:pointer;}
input,select{font-family:var(--body);}
a{color:inherit;}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* ---------- shared atoms ---------- */
.h-disp{font-family:var(--disp);font-weight:700;letter-spacing:0.2px;}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;
  font-size:12px;font-weight:600;color:var(--text-1);
  background:var(--bg-2);border:1px solid var(--line);
}
.btn{
  border:1px solid var(--line);background:var(--bg-2);color:var(--text-0);
  padding:12px 22px;border-radius:var(--radius-m);font-size:15px;font-weight:600;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{background:var(--bg-3);border-color:#33455f;}
.btn:active{transform:scale(0.97);}
.btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1c1300;border:none;box-shadow:0 6px 18px -6px rgba(226,176,74,.55);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-crimson{background:linear-gradient(180deg,var(--crimson-soft),var(--crimson));color:#2a0805;border:none;box-shadow:0 6px 18px -6px rgba(200,72,58,.5);}
.btn-pitch{background:linear-gradient(180deg,var(--pitch-soft),var(--pitch));color:#062012;border:none;}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;filter:none;box-shadow:none;}
.btn-ghost{background:transparent;border:1px solid var(--line);}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;}
.card{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius-l);}
.divider{height:1px;background:var(--line-soft);border:none;margin:0;}
.small{font-size:12.5px;color:var(--text-1);}
.tiny{font-size:11px;color:var(--text-2);}
input[type=text],input[type=number],select{
  background:var(--bg-2);border:1px solid var(--line);color:var(--text-0);
  padding:9px 12px;border-radius:8px;font-size:14px;outline:none;
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--gold);}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-1);}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:rgba(11,16,22,.86);backdrop-filter:blur(8px);z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:20px;font-weight:800;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);}
.navlinks{display:flex;gap:6px;flex-wrap:wrap;}
.navlinks button{background:transparent;border:none;color:var(--text-1);padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:600;}
.navlinks button.active{color:var(--text-0);background:var(--bg-2);}
.navlinks button:hover{color:var(--text-0);}

/* ---------- home ---------- */
.home-hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:80px 20px 60px;position:relative;overflow:hidden;
}
.home-hero::before{
  content:"";position:absolute;inset:0;
  background:
   radial-gradient(600px 300px at 50% 0%, rgba(226,176,74,.09), transparent 60%),
   repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 68px);
  pointer-events:none;
}
.eyebrow-badge{color:var(--text-2);font-size:13px;margin-bottom:18px;}
.home-title{
  font-family:var(--disp);font-weight:800;font-size:clamp(44px,9vw,104px);line-height:0.96;
  letter-spacing:0.5px;color:var(--text-0);margin:0;
}
.home-title span{color:var(--gold);}
.home-sub{font-size:clamp(15px,2vw,19px);color:var(--text-1);margin:22px 0 40px;max-width:560px;}
.home-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2;}
.home-note{margin-top:34px;font-size:12px;color:var(--text-2);max-width:520px;}
.resume-banner{
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  background:var(--bg-1);border:1px solid var(--gold);border-radius:var(--radius-m);
  padding:14px 18px;margin-bottom:28px;max-width:520px;width:100%;
}

/* ---------- generic screen shell ---------- */
.screen{max-width:1180px;margin:0 auto;padding:28px 22px 80px;width:100%;flex:1;}
.screen-head{margin-bottom:24px;}
.screen-title{font-family:var(--disp);font-size:38px;font-weight:800;margin:0 0 6px;}
.screen-desc{color:var(--text-1);font-size:14.5px;margin:0;}

/* ---------- team select ---------- */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:20px;}
.team-tile{
  border:1px solid var(--line-soft);border-radius:var(--radius-m);padding:18px;
  background:var(--bg-1);text-align:left;transition:border-color .15s,transform .12s;position:relative;
}
.team-tile:hover{border-color:var(--gold);transform:translateY(-2px);}
.team-tile.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.team-swatch{width:34px;height:34px;border-radius:8px;margin-bottom:14px;}
.team-tile h3{margin:0 0 4px;font-family:var(--disp);font-size:20px;font-weight:700;}
.team-tile .tiny{margin-top:6px;}

/* ---------- settings ---------- */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:8px;}
.setting-box{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius-m);padding:16px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;}
.toggle{
  width:42px;height:24px;border-radius:99px;background:var(--bg-3);border:1px solid var(--line);
  position:relative;transition:background .15s;flex-shrink:0;
}
.toggle.on{background:var(--pitch);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on .knob{left:20px;}

/* ---------- auction room ---------- */
.auction-layout{display:grid;grid-template-columns:230px 1fr 260px;gap:16px;align-items:start;}
@media(max-width:980px){.auction-layout{grid-template-columns:1fr;}}
.player-stage{
  background:linear-gradient(160deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--line-soft);border-radius:var(--radius-l);
  padding:26px;position:relative;overflow:hidden;
}
.player-stage::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(100deg, rgba(226,176,74,.03) 0 2px, transparent 2px 26px);
  pointer-events:none;
}
.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1;}
.player-name{font-family:var(--disp);font-size:clamp(32px,5vw,50px);font-weight:800;margin:6px 0 2px;line-height:1;}
.player-meta{color:var(--text-1);font-size:14px;letter-spacing:.3px;}
.rating-badge{
  width:64px;height:64px;border-radius:14px;background:var(--bg-3);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
}
.rating-badge b{font-family:var(--disp);font-size:24px;line-height:1;color:var(--gold);}
.rating-badge span{font-size:9.5px;color:var(--text-2);letter-spacing:.5px;}
.price-row{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:1;}
.price-box{flex:1;min-width:140px;background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius-m);padding:14px 16px;}
.price-box .label{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;}
.price-box .val{font-family:var(--disp);font-size:26px;font-weight:700;margin-top:4px;}
.price-box.current .val{color:var(--gold);}
.bidder-strip{margin-top:14px;font-size:14px;color:var(--text-1);position:relative;z-index:1;}
.bidder-strip b{color:var(--text-0);}
.timer-ring{
  width:52px;height:52px;border-radius:50%;border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:20px;font-weight:700;
  transition:border-color .2s;
}
.timer-ring.hot{border-color:var(--crimson);color:var(--crimson-soft);}
.stat-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1;}
.stat-mini{font-size:11.5px;color:var(--text-2);}
.bar-track{height:5px;background:var(--bg-3);border-radius:3px;margin-top:5px;overflow:hidden;}
.bar-fill{height:100%;background:var(--pitch-soft);border-radius:3px;}
.controls-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
.controls-row .btn{flex:1;min-width:120px;}
.sold-flash{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:64px;font-weight:800;letter-spacing:2px;z-index:5;
  background:rgba(8,12,17,.72);backdrop-filter:blur(2px);
  animation:popIn .35s ease;
}
.sold-flash.sold{color:var(--pitch-soft);}
.sold-flash.unsold{color:var(--crimson-soft);}
@keyframes popIn{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}

.feed-panel{max-height:210px;overflow-y:auto;margin-top:14px;display:flex;flex-direction:column-reverse;gap:0;}
.feed-item{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-soft);color:var(--text-1);}
.feed-item b{color:var(--text-0);}
.feed-item.you{color:var(--gold-soft);}
.feed-item.sold{color:var(--pitch-soft);font-weight:600;}
.feed-item.unsold{color:var(--crimson-soft);font-weight:600;}
.feed-item.callout{color:var(--gold-soft);font-style:italic;}
.confetti-piece{position:absolute;top:-12px;width:8px;height:14px;opacity:0.95;border-radius:2px;animation:confettiFall 1.15s ease-in forwards;z-index:6;}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(240px) rotate(340deg);opacity:0;}
}
.wishlist-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:12.5px;}
.target-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(226,176,74,.12);border:1px solid rgba(226,176,74,.4);color:var(--gold-soft);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;margin-top:8px;}

.side-card{padding:14px;margin-bottom:12px;}
.team-row{
  display:flex;justify-content:space-between;align-items:center;padding:9px 8px;border-radius:8px;font-size:13px;
}
.team-row.me{background:rgba(226,176,74,.1);border:1px solid rgba(226,176,74,.35);}
.team-row .tname{display:flex;align-items:center;gap:8px;font-weight:600;}
.team-row .swatch{width:9px;height:9px;border-radius:2px;}
.progress-track{height:7px;border-radius:4px;background:var(--bg-3);overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}

/* ---------- squad / management ---------- */
.tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tab-btn{border:1px solid var(--line);background:var(--bg-1);color:var(--text-1);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.tab-btn.active{background:var(--gold);color:#1c1300;border-color:var(--gold);}
.player-list-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-soft);align-items:center;font-size:13.5px;}
.player-list-row.head{color:var(--text-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);}
.role-tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg-3);color:var(--text-1);display:inline-block;}

.balance-ring{display:flex;align-items:center;gap:18px;}
.balance-num{font-family:var(--disp);font-size:52px;font-weight:800;color:var(--gold);}

/* ---------- results ---------- */
.rank-row{
  display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--radius-m);
  background:var(--bg-1);border:1px solid var(--line-soft);margin-bottom:10px;
}
.rank-num{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--text-2);width:44px;text-align:center;}
.rank-row.first .rank-num{color:var(--gold);}
.rank-score{font-family:var(--disp);font-size:26px;font-weight:700;}

.xi-slot{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.xi-slot .pos{color:var(--text-2);width:26px;font-size:12px;}

.compare-bar-row{margin-bottom:14px;}
.compare-bar-row .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-1);margin-bottom:4px;}
.compare-bar-track{height:10px;background:var(--bg-3);border-radius:5px;overflow:hidden;}
.compare-bar-fill{height:100%;border-radius:5px;}

.stat-tile{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--radius-m);padding:16px;}
.stat-tile .label{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;}
.stat-tile .val{font-family:var(--disp);font-size:22px;font-weight:700;margin-top:6px;}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}

.howto-step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
.howto-num{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--gold);width:32px;}

.history-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line-soft);border-radius:var(--radius-m);background:var(--bg-1);margin-bottom:10px;flex-wrap:wrap;gap:10px;}

@media(max-width:640px){
  .player-list-row{grid-template-columns:2fr 1fr 1fr;font-size:12.5px;}
  .player-list-row .col-age,.player-list-row .col-nat{display:none;}
  .topbar{flex-direction:column;align-items:flex-start;gap:10px;}
}
</style>
</head>

<div id="app"></div>
<script>
(function(){
"use strict";

/* =========================================================
   DATA
   ========================================================= */
var ROLES = ["Batter","Wicketkeeper","All-rounder","Fast Bowler","Spinner"];
var ROLE_SHORT = {"Batter":"BAT","Wicketkeeper":"WK","All-rounder":"AR","Fast Bowler":"FB","Spinner":"SPIN"};
var IDEAL_ROLE_FRACTION = {"Batter":0.30,"Wicketkeeper":0.10,"All-rounder":0.22,"Fast Bowler":0.24,"Spinner":0.14};
var ROLE_COLORS = {"Batter":"#2f6fbe","Wicketkeeper":"#3f9e6c","All-rounder":"#7a52b8","Fast Bowler":"#c8483a","Spinner":"#d98a2b"};

/* ---- generated avatar/crest art (no real photos or logos are used anywhere) ---- */
function svgEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function initialsOf(name){
  var parts = String(name).trim().split(/\s+/);
  var out = parts[0] ? parts[0][0] : "?";
  if(parts.length>1) out += parts[parts.length-1][0];
  return out.toUpperCase();
}
function playerAvatarSVG(p, size){
  size = size||72;
  var color = ROLE_COLORS[p.role] || "#45607d";
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display:block;flex-shrink:0;">'+
    '<circle cx="50" cy="50" r="48" fill="'+color+'"/>'+
    '<circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"/>'+
    '<circle cx="50" cy="38" r="15" fill="rgba(255,255,255,.16)"/>'+
    '<path d="M20 92 Q50 62 80 92 Z" fill="rgba(255,255,255,.16)"/>'+
    '<text x="50" y="60" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="36" fill="rgba(255,255,255,.95)">'+svgEsc(initialsOf(p.name))+'</text>'+
    '</svg>';
}
function teamCrestSVG(t, size){
  size = size||56;
  var short = (t.short || String(t.name||"").slice(0,3)).toUpperCase();
  return '<svg width="'+size+'" height="'+(size*1.1)+'" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" style="display:block;flex-shrink:0;">'+
    '<path d="M50 4 L92 18 V54 C92 80 74 99 50 108 C26 99 8 80 8 54 V18 Z" fill="'+t.color+'"/>'+
    '<path d="M50 4 L92 18 V54 C92 80 74 99 50 108 C26 99 8 80 8 54 V18 Z" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2"/>'+
    '<text x="50" y="64" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="'+(short.length>3?22:28)+'" fill="rgba(255,255,255,.95)">'+svgEsc(short)+'</text>'+
    '</svg>';
}

var DEFAULT_TEAM_TEMPLATES = [
  {name:"Mumbai Indians", short:"MI", color:"#1f5fae"},
  {name:"Chennai Super Kings", short:"CSK", color:"#e2b04a"},
  {name:"Royal Challengers Bengaluru", short:"RCB", color:"#c8483a"},
  {name:"Kolkata Knight Riders", short:"KKR", color:"#5b3a86"},
  {name:"Rajasthan Royals", short:"RR", color:"#d16bb0"},
  {name:"Sunrisers Hyderabad", short:"SRH", color:"#e08a2b"},
  {name:"Delhi Capitals", short:"DC", color:"#3560c9"},
  {name:"Punjab Kings", short:"PBKS", color:"#b03a4e"},
  {name:"Lucknow Super Giants", short:"LSG", color:"#3fa8b5"},
  {name:"Gujarat Titans", short:"GT", color:"#7a7a7a"}
];

var AI_PERSONALITIES = ["Conservative","Balanced","Aggressive","Superstar Hunter","Value Buyer"];

// Real players from the current IPL 2026 squads (retained cores + auction acquisitions),
// grouped by the ten real franchises. Ratings/sub-stats are our own approximation for
// gameplay purposes, not official numbers — but every name, role, nationality and team
// grouping reflects the actual 2026 rosters.
var CURATED_PLAYERS = [
 // Chennai Super Kings
 ["MS Dhoni","Wicketkeeper","India",82,78,20,82,44,false,2],
 ["Ruturaj Gaikwad","Batter","India",90,91,20,78,29,false,2],
 ["Sanju Samson","Wicketkeeper","India",88,89,20,76,31,false,2],
 ["Shivam Dube","All-rounder","India",83,84,60,70,32,false,1.5],
 ["Dewald Brevis","Batter","South Africa",81,83,25,72,22,true,1.5],
 ["Noor Ahmad","Spinner","Afghanistan",85,30,87,68,21,true,2],
 ["Khaleel Ahmed","Fast Bowler","India",80,25,83,68,28,false,1.5],
 ["Jamie Overton","All-rounder","England",78,70,76,70,32,true,1],
 ["Ayush Mhatre","Batter","India",75,78,20,66,18,false,0.75],
 ["Rahul Chahar","Spinner","India",78,30,80,65,26,false,1],
 ["Matt Henry","Fast Bowler","New Zealand",84,25,86,70,34,true,1],
 ["Nathan Ellis","Fast Bowler","Australia",80,25,82,68,30,true,1],
 ["Sarfaraz Khan","Batter","India",80,82,20,66,28,false,0.75],
 ["Urvil Patel","Wicketkeeper","India",68,70,20,62,22,false,0.3],
 ["Mukesh Choudhary","Fast Bowler","India",72,25,75,62,27,false,0.5],
 // Mumbai Indians
 ["Rohit Sharma","Batter","India",90,91,20,78,38,false,2],
 ["Jasprit Bumrah","Fast Bowler","India",96,35,97,75,32,false,2],

function rand(min,max){return Math.random()*(max-min)+min;}
function ri(min,max){return Math.floor(rand(min,max+1));}
function pick(arr){return arr[ri(0,arr.length-1)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function uid(){return "p"+(_idc++)+"_"+Math.random().toString(36).slice(2,7);}
var _idc=1;

function fairValueForRating(rating){
  if(rating>=92) return rand(14,22);
  if(rating>=86) return rand(7,14);
  if(rating>=78) return rand(3,7);
  if(rating>=68) return rand(1,3);
  return rand(0.2,1);
}

function makeGeneratedPlayer(){
  var nation = pick(NATIONS);
  var overseasNation = nation!=="India";
  var role = pick(ROLES);
  var bat, bowl, field, rating;
  var base = ri(55,84);
  if(role==="Batter"){bat=clamp(base+ri(0,10),50,95);bowl=ri(10,30);}
  else if(role==="Wicketkeeper"){bat=clamp(base+ri(0,8),50,93);bowl=ri(10,25);}
  else if(role==="All-rounder"){bat=clamp(base-ri(0,8),45,88);bowl=clamp(base-ri(0,8),45,88);}
  else if(role==="Fast Bowler"){bowl=clamp(base+ri(0,10),50,95);bat=ri(15,35);}
  else {bowl=clamp(base+ri(0,10),50,93);bat=ri(15,35);}
  field=ri(60,88);
  rating=Math.round(role==="All-rounder" ? (bat*0.5+bowl*0.5) : (role==="Batter"||role==="Wicketkeeper" ? bat*0.82+field*0.18 : bowl*0.82+field*0.18));
  rating = clamp(rating,52,93);
  var name = pick(FIRST_NAMES[nation])+" "+pick(LAST_NAMES[nation]);
  var age = ri(19,38);
  var basePrice = rating>=85?2: (rating>=75?1: (rating>=60?0.5:0.3));
  return {
    id:uid(), name:name, role:role, nationality:nation, overseas:overseasNation,
    rating:rating, batting:bat, bowling:bowl, fielding:field, age:age, basePrice:basePrice
  };
}

function buildInitialPlayerPool(){
  var seen = {};
  var list = [];
  CURATED_PLAYERS.forEach(function(p){
    if(seen[p[0]]) return; // guard against any accidental duplicate curated entries
    seen[p[0]] = 1;
    list.push({
      id:uid(), name:p[0], role:p[1], nationality:p[2], rating:p[3],
      batting:p[4], bowling:p[5], fielding:p[6], age:p[7], overseas:p[8], basePrice:p[9]
    });
  });
  // The pool is the real 2026 IPL rosters above — no fictional filler players are added.
  return list;
}

/* =========================================================

   ========================================================= */
function ensureAudioCtx(){
  if(window._audioCtx) return window._audioCtx;
  try{ window._audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ window._audioCtx = null; }
  return window._audioCtx;
}
function playTone(freq, dur, type, vol){
  if(!S.soundOn) return;
  var ctx = ensureAudioCtx();
  if(!ctx) return;
  try{
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type||"sine"; osc.frequency.value = freq;
    gain.gain.value = vol==null?0.05:vol;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + (dur||0.15));
  }catch(e){}
}
function playTick(){ playTone(880,0.05,"square",0.03); }
function playBidBlip(){ playTone(660,0.07,"sine",0.045); }
function playSoldChime(){
  playTone(523,0.12,"triangle",0.06);
  setTimeout(function(){ playTone(659,0.12,"triangle",0.06); }, 110);

}

function hasStorage(){ return typeof window!=="undefined" && window.storage; }

function serializeState(){
  return JSON.stringify({
    settings:S.settings, teams:S.teams, userTeamId:S.userTeamId,
    humanTeamIds:S.humanTeamIds, activeSeatId:S.activeSeatId, squadViewTeamId:S.squadViewTeamId,
    queue:S.queue.map(function(p){return p.id;}),
    qIndex:S.qIndex, currentPlayer:S.currentPlayer, currentBid:S.currentBid,
    currentBidder:S.currentBidder, bidHistory:S.bidHistory, feed:S.feed.slice(-60),
    soldList:S.soldList, unsoldList:S.unsoldList, playerPool:S.playerPool,
    savedAt:Date.now()
  });
}

function saveActiveAuction(){
  if(!hasStorage()) return;
  try{
    window.storage.set("ipl_active_auction", serializeState(), false).catch(function(){});
  }catch(e){}
}

function clearActiveAuction(){
  if(!hasStorage()) return;
  try{ window.storage.delete("ipl_active_auction", false).catch(function(){}); }catch(e){}
}

function loadActiveAuctionCheck(){
  if(!hasStorage()){ render(); return; }
  window.storage.get("ipl_active_auction", false).then(function(res){
    S.hasResumableSave = !!(res && res.value);
    render();
  }).catch(function(){ render(); });
}

function resumeAuction(){
  if(!hasStorage()) return;
  window.storage.get("ipl_active_auction", false).then(function(res){
    if(!res || !res.value) return;
    var d;
    try{ d = JSON.parse(res.value); }catch(e){ return; }
    S.settings = d.settings; S.teams = d.teams; S.userTeamId = d.userTeamId;
    S.humanTeamIds = d.humanTeamIds || (S.teams.filter(function(t){return t.isUser;}).map(function(t){return t.id;}));
    S.activeSeatId = d.activeSeatId || S.humanTeamIds[0] || S.userTeamId;
    S.squadViewTeamId = d.squadViewTeamId || S.userTeamId;
    S.playerPool = d.playerPool || S.playerPool;
    var byId = {}; S.playerPool.forEach(function(p){byId[p.id]=p;});
    S.queue = (d.queue||[]).map(function(id){return byId[id];}).filter(Boolean);
    S.qIndex = d.qIndex; S.currentPlayer = d.currentPlayer; S.currentBid = d.currentBid;
    S.currentBidder = d.currentBidder; S.bidHistory = d.bidHistory||[];
    S.feed = d.feed||[]; S.soldList = d.soldList||[]; S.unsoldList = d.unsoldList||[];
    S.timerFull = SPEED_MAP[S.settings.speed]||8; S.timerValue = S.timerFull;
    S.passedThisRound = {};
    S.screen = "auction";
    render();
    startTicking();
  }).catch(function(){});
}

function loadHistoryList(cb){
  if(!hasStorage()){ cb([]); return; }
  window.storage.get("ipl_history_list", false).then(function(res){
    if(!res || !res.value){ cb([]); return; }
    try{ cb(JSON.parse(res.value)); }catch(e){ cb([]); }
  }).catch(function(){ cb([]); });
}

function saveHistoryList(list){
  if(!hasStorage()) return;
  try{ window.storage.set("ipl_history_list", JSON.stringify(list), false).catch(function(){}); }catch(e){}
}

function pushHistoryEntry(entry){
  loadHistoryList(function(list){
    list.unshift(entry);
    if(list.length>40) list = list.slice(0,40);
    saveHistoryList(list);
    S.savedHistoryList = list;
  });
}

function buildTeams(picks, numTeams, startingPurse){
  var templates = DEFAULT_TEAM_TEMPLATES.slice(0, Math.max(2,Math.min(10,numTeams)));
  var teams = templates.map(function(t,i){
    return {
      id:"team_"+i, name:t.name, short:t.short, color:t.color,
      isUser:false, purse:startingPurse, squad:[], personality:pick(AI_PERSONALITIES), wishlist:[]
    };
  });
  picks.forEach(function(p){
    if(p.custom){
      var freeIdx = -1;
      for(var i=0;i<teams.length;i++){ if(!teams[i].isUser){ freeIdx=i; break; } }
      var newTeam = {
        id: freeIdx>=0 ? teams[freeIdx].id : "team_"+teams.length,
        name:p.name, short:p.short||p.name.slice(0,3).toUpperCase(), color:p.color||"#e2b04a",
        logoUrl:p.logoUrl||null,
        isUser:true, purse:startingPurse, squad:[], personality:"Friend", wishlist:[]
      };
      if(freeIdx>=0) teams[freeIdx] = newTeam; else teams.push(newTeam);
    } else {
      for(var j=0;j<teams.length;j++){
        if(teams[j].name===p.name){ teams[j].isUser=true; teams[j].personality="Friend"; break; }
      }
    }
  });
  if(!teams.some(function(t){return t.isUser;})){ teams[0].isUser=true; teams[0].personality="Friend"; }
  return teams;
}

function shuffledQueue(pool){
  var arr = pool.slice();
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}

function beginAuction(picks){
  var st = S.settings;
  S.teams = buildTeams(picks, st.numTeams, st.purse);
  S.humanTeamIds = S.teams.filter(function(t){return t.isUser;}).map(function(t){return t.id;});
  S.userTeamId = S.humanTeamIds[0];
  S.activeSeatId = S.userTeamId;
  S.squadViewTeamId = S.userTeamId;
  var primary = S.teams.filter(function(t){return t.id===S.userTeamId;})[0];
  if(primary) primary.wishlist = S.pendingWishlist.slice();
  S.queue = shuffledQueue(S.playerPool);
  S.qIndex = -1;
  S.soldList = []; S.unsoldList = []; S.feed = [];
  S.timerFull = SPEED_MAP[st.speed] || 8;
  S.auctionStartedAt = Date.now();
  S.screen = "auction";
  advanceToNextPlayer();
  render();
  startTicking();
}

function advanceToNextPlayer(){
  S.qIndex++;
  S.flash = null;
  if(S.qIndex >= S.queue.length){
    finishAuction();
    return;
  }
  S.currentPlayer = S.queue[S.qIndex];
  S.currentBid = S.currentPlayer.basePrice;
  S.currentBidder = null;
  S.bidHistory = [];
  S.passedThisRound = {};
  S.timerValue = S.timerFull;
  S.calledThresholds = {};
  pushFeed("Entering the auction: "+S.currentPlayer.name+" — base price ₹"+fmt(S.currentPlayer.basePrice)+" Cr", "");
}

function pushFeed(text, cls){
  S.feed.push({text:text, cls:cls||"", t:Date.now()});
  if(S.feed.length>200) S.feed = S.feed.slice(-150);
}

function fmt(n){
  if(Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
  return n.toFixed(2).replace(/0$/,"").replace(/\.$/,"");
}

/* ---- squad legality checks ---- */
function overseasCount(team){ return team.squad.filter(function(p){return p.overseas;}).length; }
function canAfford(team, amount){ return team.purse >= amount - 0.0001; }
function squadFull(team){ return team.squad.length >= S.settings.maxSquad; }
function canBidOnPlayer(team, player, amount){
  if(squadFull(team)) return false;
  if(!canAfford(team, amount)) return false;
  if(player.overseas && overseasCount(team) >= S.settings.maxOverseas) return false;
  return true;
}

/* =========================================================
   AI BIDDING ENGINE
   ========================================================= */
function roleNeedScore(team, role){
  var count = team.squad.filter(function(p){return p.role===role;}).length;
  var idealCount = IDEAL_ROLE_FRACTION[role] * S.settings.maxSquad;
  if(idealCount<=0) return 0.3;
  var ratio = count/idealCount;
  return clamp(1.4 - ratio, 0, 1.4);
}

function difficultyNoise(){
  var d = S.settings.aiDifficulty;
  if(d==="Easy") return 0.42;
  if(d==="Hard") return 0.08;
  return 0.22;
}

function reserveBudget(team){
  var slotsStillNeeded = Math.max(0, S.settings.minSquad - team.squad.length - 1);
  return slotsStillNeeded * 0.25; // keep enough pocket change to fill out the minimum squad
}

function personalityCeiling(team, player){
  var mult = 1.6;
  if(team.personality==="Aggressive") mult += 0.35;
  if(team.personality==="Conservative") mult -= 0.5;
  if(team.personality==="Value Buyer") mult -= 0.35;
  if(team.personality==="Superstar Hunter") mult += (player.rating>=87 ? 0.8 : -0.6);
  return Math.max(1.05, mult);
}

function aiDesire(team, player, currentBid, nextAmount){
  if(!canBidOnPlayer(team, player, nextAmount)) return -1;
  if(nextAmount > team.purse - reserveBudget(team)) return -1;
  var fair = fairValueForRating(player.rating);
  var ceiling = Math.min(fair * personalityCeiling(team, player), 35);
  if(nextAmount > ceiling) return -1;

  var need = roleNeedScore(team, player.role);
  var ratingFactor = player.rating/100;
  var ratio = nextAmount / Math.max(fair, 0.2); // 1 = paying fair value, >1 = overpaying
  var priceGap = ratio <= 1 ? (1 - ratio) : -((ratio - 1) * 1.6);
  var purseFrac = team.purse / (S.settings.purse||100);
  var slotsLeft = S.settings.maxSquad - team.squad.length;
  var urgency = clamp((S.queue.length - S.qIndex) > 0 ? slotsLeft / Math.max(1,(S.queue.length-S.qIndex)*0.55) : 1, 0, 1.6);

  var w = {need:0.34, rating:0.22, price:0.28, purse:0.08, urgency:0.08};
  var score = need*w.need + ratingFactor*w.rating + clamp(priceGap,-1.6,1)*w.price + purseFrac*w.purse + urgency*w.urgency;

  switch(team.personality){
    case "Conservative":
      score = score*0.75 + clamp(priceGap,-1.6,1)*0.25;
      break;
    case "Aggressive":
      score += 0.18;
      if(need>0.6) score += 0.15;
      break;
    case "Superstar Hunter":
      if(player.rating>=87) score += 0.45; else score -= 0.3;
      break;
    case "Value Buyer":
      score += clamp(priceGap,-1.6,1)*0.35;
      break;
    default: // Balanced
      break;
  }
  score += (Math.random()-0.5)*difficultyNoise()*2;
  return score;
}

function aiConsiderBids(){
  if(!S.currentPlayer) return;
  var candidates = S.teams.filter(function(t){ return !t.isUser && !S.passedThisRound[t.id] && t.id!==S.currentBidder; });
  var best = null, bestScore = -Infinity;
  candidates.forEach(function(team){
    var jump = (team.personality==="Aggressive"||team.personality==="Superstar Hunter") && Math.random()<0.18 ? 2 : 1;
    var nextAmount = S.currentBid + S.settings.increment*jump;
    var d = aiDesire(team, S.currentPlayer, S.currentBid, nextAmount);
    if(d > bestScore){ bestScore = d; best = {team:team, nextAmount:nextAmount}; }
  });
  var threshold = 0.34;
  if(best && bestScore > threshold){
    var chance = clamp(0.32 + bestScore*0.28, 0.1, 0.85);
    if(Math.random() < chance){
      doBid(best.team, best.nextAmount);
      return;
    }
  }
  candidates.forEach(function(team){
    if(team===((best||{}).team)) return;
    var nextAmount = S.currentBid + S.settings.increment;
    if(!canBidOnPlayer(team, S.currentPlayer, nextAmount)){
      if(nextAmount > team.purse || (S.currentPlayer.overseas && overseasCount(team)>=S.settings.maxOverseas) || squadFull(team)){
        S.passedThisRound[team.id] = true;
      }
    }
  });
}

function doBid(team, amount){
  amount = Math.round(amount*100)/100;
  S.currentBid = amount;
  S.currentBidder = team.id;
  S.bidHistory.push({teamId:team.id, amount:amount});
  S.timerValue = S.timerFull;
  S.calledThresholds = {};
  var soloYou = team.isUser && S.humanTeamIds.length<=1;
  var label = soloYou ? "You" : team.name;
  pushFeed(label+" bid ₹"+fmt(amount)+" Cr", team.isUser?"you":"");
  if(team.isUser) playBidBlip();
}

/* =========================================================
   TICK LOOP
   ========================================================= */
function startTicking(){
  stopTicking();
  S.tickHandle = setInterval(tick, 1000);
}
function stopTicking(){
  if(S.tickHandle){ clearInterval(S.tickHandle); S.tickHandle=null; }
}
function tick(){
  if(S.screen!=="auction" || S.paused || !S.currentPlayer || S.flash) return;
  S.timerValue--;
  if(S.timerValue <= 0){
    finalizeSale();
  } else {
    if(S.currentBidder){
      if(S.timerValue===3 && !S.calledThresholds.once){
        pushFeed("Going once...", "callout"); S.calledThresholds.once=true;
      } else if(S.timerValue===1 && !S.calledThresholds.twice){
        pushFeed("Going twice...", "callout"); S.calledThresholds.twice=true;
      }
    }
    if(S.timerValue<=3) playTick();
    aiConsiderBids();
    if(S.currentBidder !== S.userTeamId) maybeAutoBidUser();
  }
  render();
}

function finalizeSale(){
  stopTicking();
  var player = S.currentPlayer;
  if(S.currentBidder){
    var team = S.teams.filter(function(t){return t.id===S.currentBidder;})[0];
    team.purse = Math.round((team.purse - S.currentBid)*100)/100;
    team.squad.push(Object.assign({}, player, {soldPrice:S.currentBid}));
    S.soldList.push({player:player, teamId:team.id, price:S.currentBid});
    pushFeed("SOLD — "+player.name+" to "+team.name+" for ₹"+fmt(S.currentBid)+" Cr", "sold");
    S.flash = {type:"sold", teamName:team.name, price:S.currentBid};
    playSoldChime();
  } else {
    S.unsoldList.push(player);
    pushFeed(player.name+" goes UNSOLD", "unsold");
    S.flash = {type:"unsold"};
    playUnsoldBuzz();
  }
  saveActiveAuction();
  render();
  S.flashHandle = setTimeout(function(){
    S.flash = null;
    if(!S.paused){
      advanceToNextPlayer();
      render();
      if(S.screen==="auction") startTicking();
    }
  }, 1600);
}

function finishAuction(){
  stopTicking();
  S.currentPlayer = null;
  S.screen = "results";
  clearActiveAuction();
  var results = computeResults();
  pushHistoryEntry({
    id:"h_"+Date.now(), name:"Auction — "+new Date().toLocaleDateString(),
    date:Date.now(),
    results: results.map(function(r){return {name:r.team.name, score:r.score, purseLeft:r.team.purse};}),
    stats: computeStats()
  });
  render();
}

/* =========================================================
   SQUAD ANALYSIS / RESULTS
   ========================================================= */
function computeBalance(team){
  var counts = {}; ROLES.forEach(function(r){counts[r]=0;});
  team.squad.forEach(function(p){ counts[p.role] = (counts[p.role]||0)+1; });
  var n = team.squad.length || 1;
  var diffSum = 0;
  ROLES.forEach(function(r){
    var actualFrac = counts[r]/n;
    diffSum += Math.abs(actualFrac - IDEAL_ROLE_FRACTION[r]);
  });
  var roleScore = clamp(100 - diffSum*90, 0, 100);
  var avgRating = team.squad.length ? team.squad.reduce(function(a,p){return a+p.rating;},0)/team.squad.length : 0;
  var ratingScore = clamp((avgRating-45)/45*100, 0, 100);
  var sizeOk = team.squad.length >= S.settings.minSquad;
  var score = Math.round(roleScore*0.55 + ratingScore*0.45) - (sizeOk?0:12);
  return {score:clamp(score,0,100), counts:counts, avgRating:Math.round(avgRating), roleScore:Math.round(roleScore)};
}

function weakestRole(counts, n){
  var worst=null, worstGap=-Infinity;
  ROLES.forEach(function(r){
    var actual = (counts[r]||0)/(n||1);
    var gap = IDEAL_ROLE_FRACTION[r]-actual;
    if(gap>worstGap){worstGap=gap; worst=r;}
  });
  return worst;
}
function strongestRole(counts, n){
  var best=null, bestGap=-Infinity;
  ROLES.forEach(function(r){
    var actual = (counts[r]||0)/(n||1);
    var gap = actual-IDEAL_ROLE_FRACTION[r];
    if(gap>bestGap){bestGap=gap; best=r;}
  });
  return best;
}

function generatePlayingXI(team){
  var pool = team.squad.slice().sort(function(a,b){return b.rating-a.rating;});
  var slots = ["Batter","Batter","Batter","Batter","Wicketkeeper","All-rounder","All-rounder","Spinner","Fast Bowler","Fast Bowler","Fast Bowler"];
  var used = {}; var xi = []; var overseasUsed = 0;
  function takeBest(role, allowOverseasLimit){
    for(var i=0;i<pool.length;i++){
      var p = pool[i];
      if(used[p.id]) continue;
      if(role && p.role!==role) continue;
      if(p.overseas && overseasUsed>=4) continue;
      used[p.id]=true;
      if(p.overseas) overseasUsed++;
      return p;
    }
    return null;
  }
  slots.forEach(function(role){
    var p = takeBest(role);
    if(!p) p = takeBest(null);
    if(p) xi.push(Object.assign({}, p, {slot:role}));
  });
  var bench = pool.filter(function(p){return !used[p.id];});
  return {xi:xi, bench:bench};
}

function computeResults(){
  var results = S.teams.map(function(team){
    var bal = computeBalance(team);
    var xiData = generatePlayingXI(team);
    var xiAvg = xiData.xi.length ? xiData.xi.reduce(function(a,p){return a+p.rating;},0)/xiData.xi.length : 0;
    var score = Math.round(clamp(xiAvg,0,100)*0.65 + bal.score*0.35);
    return {team:team, score:score, balance:bal, xi:xiData.xi, bench:xiData.bench};
  });
  results.sort(function(a,b){return b.score-a.score;});
  return results;
}

function computeStats(){
  var stats = {};
  if(S.soldList.length){
    var mostExp = S.soldList.slice().sort(function(a,b){return b.price-a.price;})[0];
    stats.mostExpensive = mostExp.player.name+" — ₹"+fmt(mostExp.price)+" Cr";
    var bargain = S.soldList.slice().sort(function(a,b){
      return (b.player.rating/(b.price||0.1)) - (a.player.rating/(a.price||0.1));
    })[0];
    stats.biggestBargain = bargain.player.name+" — ₹"+fmt(bargain.price)+" Cr (rating "+bargain.player.rating+")";
    var surprise = S.soldList.slice().sort(function(a,b){
      return (b.price - b.player.basePrice) - (a.price - a.player.basePrice);
    })[0];
    stats.surprise = surprise.player.name+" (base ₹"+fmt(surprise.player.basePrice)+" → ₹"+fmt(surprise.price)+" Cr)";
  }
  var byTeamCount = S.teams.slice().sort(function(a,b){return b.squad.length-a.squad.length;})[0];
  stats.mostActive = byTeamCount ? byTeamCount.name+" — "+byTeamCount.squad.length+" players" : "—";
  var byPurse = S.teams.slice().sort(function(a,b){return b.purse-a.purse;})[0];
  stats.mostPurseLeft = byPurse ? byPurse.name+" — ₹"+fmt(byPurse.purse)+" Cr" : "—";
  function avgRoleRating(team, roles){
    var arr = team.squad.filter(function(p){return roles.indexOf(p.role)>=0;});
    if(!arr.length) return 0;
    return arr.reduce(function(a,p){return a+ (roles.indexOf("Batter")>=0?p.batting:p.bowling);},0)/arr.length;
  }
  var bestBat = S.teams.slice().sort(function(a,b){return avgRoleRating(b,["Batter","Wicketkeeper"])-avgRoleRating(a,["Batter","Wicketkeeper"]);})[0];
  var bestBowl = S.teams.slice().sort(function(a,b){return avgRoleRating(b,["Fast Bowler","Spinner"])-avgRoleRating(a,["Fast Bowler","Spinner"]);})[0];
  stats.strongestBatting = bestBat ? bestBat.name : "—";
  stats.strongestBowling = bestBowl ? bestBowl.name : "—";
  var mostBalanced = S.teams.slice().sort(function(a,b){return computeBalance(b).score-computeBalance(a).score;})[0];
  stats.mostBalanced = mostBalanced ? mostBalanced.name+" ("+computeBalance(mostBalanced).score+"/100)" : "—";
  stats.unsoldCount = S.unsoldList.length;
  return stats;
}

function userTeam(){ return S.teams.filter(function(t){return t.id===S.userTeamId;})[0]; }

}

window.userBid = function(teamId, mult){
  mult = mult || 1;
  var team = S.teams.filter(function(t){return t.id===(teamId||S.activeSeatId||S.userTeamId);})[0];
  if(!team || !S.currentPlayer || S.flash) return;
  var nextAmount = Math.round((S.currentBid + S.settings.increment*mult)*100)/100;
  if(!canBidOnPlayer(team, S.currentPlayer, nextAmount)){
    pushFeed(team.name+" can't place that bid right now (purse, squad size, or overseas limit).", "unsold");
    render();
    return;
  }
  doBid(team, nextAmount);
  render();
};

  S.passedThisRound[team.id] = true;

// auto-bid for user's team (runs inside tick via separate check)
function maybeAutoBidUser(){
  if(!S.settings.autoBidUserOn) return;
  var team = userTeam();
  if(!team || S.passedThisRound[team.id]) return;
  var nextAmount = S.currentBid + S.settings.increment;
  if(!canBidOnPlayer(team, S.currentPlayer, nextAmount)) return;
  var strat = S.settings.autoBidStrategy;
  var fair = fairValueForRating(S.currentPlayer.rating);
  var need = roleNeedScore(team, S.currentPlayer.role);
  var willingness = 0.3;
  if(strat==="Aggressive") willingness = 0.55;
  if(strat==="Value") willingness = nextAmount < fair*0.85 ? 0.6 : 0.05;
  if(strat==="Star Players Only") willingness = S.currentPlayer.rating>=86 ? 0.7 : 0.02;
  if(strat==="Balanced") willingness = 0.28 + need*0.25;
  if(Math.random() < willingness){ doBid(team, nextAmount); }
}

    case "auction": html += renderAuction(); break;

    case "management": html += renderManagement(); break;
    case "results": html += renderResults(); break;
    case "comparison": html += renderComparison(); break;

    default: html += renderHome();

  root.innerHTML = html;
  wireDynamicInputs();
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* =========================================================
   ORIGINAL, GENERATED ARTWORK — player avatars & team crests
   (No real photos or official logos are used anywhere in this
   app; everything below is drawn from initials/colors.)
   ========================================================= */
var ROLE_GLYPH = {"Batter":"🏏","Wicketkeeper":"🧤","All-rounder":"⚡","Fast Bowler":"🔥","Spinner":"🌀"};
var AVATAR_PALETTE = ["#c8483a","#e2b04a","#3f6e52","#3560c9","#7a4fae","#c96b2b","#2e8f8f","#a83f7a"];
function initials(name){
  var parts = String(name||"").trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function hashSeed(str){
  var h=0; for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h;
}
function playerAvatarHTML(p, size){
  size = size||56;
  if(p.photoUrl){
    return '<img src="'+p.photoUrl+'" style="width:'+size+'px;height:'+size+'px;border-radius:'+Math.round(size*0.24)+'px;flex-shrink:0;object-fit:cover;border:1px solid var(--line-soft);" />';
  }
  var color = AVATAR_PALETTE[hashSeed(p.name)%AVATAR_PALETTE.length];
  var glyph = ROLE_GLYPH[p.role]||"🏏";
  var fs = Math.round(size*0.34);
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:'+Math.round(size*0.24)+'px;flex-shrink:0;position:relative;'+
    'background:linear-gradient(150deg,'+color+'cc,'+color+'55);border:1px solid '+color+';'+
    'display:flex;align-items:center;justify-content:center;">'+
    '<span style="font-family:var(--disp);font-weight:800;font-size:'+fs+'px;color:#fff;letter-spacing:0.5px;">'+esc(initials(p.name))+'</span>'+
    '<span style="position:absolute;bottom:-4px;right:-4px;background:var(--bg-1);border:1px solid var(--line-soft);border-radius:50%;width:'+Math.round(size*0.34)+'px;height:'+Math.round(size*0.34)+'px;display:flex;align-items:center;justify-content:center;font-size:'+Math.round(size*0.18)+'px;">'+glyph+'</span>'+
    '</div>';
}
function teamCrestHTML(team, size){
  size = size||22;
  if(team.logoUrl){
    return '<img src="'+team.logoUrl+'" style="width:'+size+'px;height:'+size+'px;border-radius:'+Math.round(size*0.22)+'px;object-fit:cover;flex-shrink:0;vertical-align:middle;margin-right:6px;border:1px solid var(--line-soft);" />';
  }
  var color = team.color||"#e2b04a";
  var short = (team.short||team.name||"?").slice(0,4).toUpperCase();
  var fs = Math.max(7, Math.round(size*0.34));
  return '<span style="display:inline-flex;align-items:center;justify-content:center;width:'+size+'px;height:'+size+'px;'+
    'border-radius:'+Math.round(size*0.28)+'px 0 '+Math.round(size*0.28)+'px 0;background:linear-gradient(150deg,'+color+',#0b1016);'+
    'border:1px solid '+color+';color:#fff;font-family:var(--disp);font-weight:800;font-size:'+fs+'px;flex-shrink:0;vertical-align:middle;margin-right:6px;line-height:1;">'+
    esc(short.slice(0,3))+'</span>';
}
function readFileAsDataUrl(file, cb){
  if(!file){ cb(null); return; }
  var reader = new FileReader();
  reader.onload = function(){ cb(reader.result); };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}
var CONFETTI_COLORS = ["#e2b04a","#f0cf85","#79c79a","#c8483a","#e2685a","#8fb8e6"];
function confettiHTML(){
  var pieces = "";
  for(var i=0;i<26;i++){
    var left = (Math.random()*100).toFixed(1);
    var color = CONFETTI_COLORS[i%CONFETTI_COLORS.length];
    var delay = (Math.random()*0.35).toFixed(2);
    var rot = Math.round(Math.random()*40-20);
    pieces += '<div class="confetti-piece" style="left:'+left+'%;background:'+color+';animation-delay:'+delay+'s;transform:rotate('+rot+'deg);"></div>';
  }
  return pieces;
}

window.addToWishlist = function(id){
  if(S.pendingWishlist.length>=3 || S.pendingWishlist.indexOf(id)>=0) return;

};
window.removeFromWishlist = function(id){
  S.pendingWishlist = S.pendingWishlist.filter(function(x){return x!==id;});

};

function squadBalanceNote(bal, team){
  var n = team.squad.length;
  if(n===0) return "No players bought yet.";
  var weak = weakestRole(bal.counts, n);
  var strong = strongestRole(bal.counts, n);
  var msgs = [];
  if(bal.score>=80) msgs.push("Excellent, well-rounded squad.");
  else if(bal.score>=60) msgs.push("Solid squad with a couple of gaps.");
  else msgs.push("Squad needs more depth and balance.");
  msgs.push("Needs another specialist "+weak.toLowerCase()+".");
  msgs.push("Strongest area: "+strong.toLowerCase()+"s.");
  return msgs.join(" ");
}

/* ---------- COMPARISON ---------- */
function renderComparison(){
  if(!S.teams.length) return '<div class="screen"><p class="small">No active auction to compare.</p></div>';
  var metrics = [
    ["Batting", function(t){ return avgOf(t, ["Batter","Wicketkeeper"], "batting"); }],
    ["Bowling", function(t){ return avgOf(t, ["Fast Bowler","Spinner"], "bowling"); }],
    ["All-rounders", function(t){ return countRole(t,"All-rounder"); }],
    ["Wicketkeeping", function(t){ return avgOf(t, ["Wicketkeeper"], "batting"); }],
    ["Bench strength", function(t){ return generatePlayingXI(t).bench.reduce(function(a,p){return a+p.rating;},0)/Math.max(1,generatePlayingXI(t).bench.length); }],
    ["Squad balance", function(t){ return computeBalance(t).score; }],
    ["Overall", function(t){ return computeResults().filter(function(r){return r.team.id===t.id;})[0].score; }]
  ];
  function avgOf(t, roles, key){
    var arr = t.squad.filter(function(p){return roles.indexOf(p.role)>=0;});
    if(!arr.length) return 0;
    return arr.reduce(function(a,p){return a+p[key];},0)/arr.length;
  }
  function countRole(t, role){ return t.squad.filter(function(p){return p.role===role;}).length * 10; }

  var maxVals = metrics.map(function(m){ return Math.max(1, Math.max.apply(null, S.teams.map(m[1]))); });

  var blocks = metrics.map(function(m, mi){
    var rows = S.teams.map(function(t){
      var v = m[1](t);
      var pct = clamp((v/maxVals[mi])*100, 2, 100);
      return '<div class="compare-bar-row"><div class="lbl"><span>'+esc(t.short||t.name)+'</span><span>'+Math.round(v)+'</span></div>'+
        '<div class="compare-bar-track"><div class="compare-bar-fill" style="width:'+pct+'%;background:'+t.color+'"></div></div></div>';
    }).join("");
    return '<div class="card" style="padding:18px;"><h3 class="h-disp" style="margin:0 0 12px;font-size:19px;">'+m[0]+'</h3>'+rows+'</div>';
  }).join("");

  return '<div class="screen"><div class="screen-head">'+
    '<h1 class="screen-title">Team Comparison</h1>'+
    '<p class="screen-desc">Side-by-side strength across every dimension that matters.</p></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">'+blocks+'</div>'+
    '</div>';
}

/* =========================================================
   TWO-WAY BINDING for plain inputs (data-bind)
   ========================================================= */
function getPath(obj, path){
  return path.split(".").reduce(function(o,k){ return o? o[k] : undefined; }, obj);
}
function setPath(obj, path, val){
  var parts = path.split(".");
  var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function wireDynamicInputs(){
  var els = root.querySelectorAll("[data-bind]");
  els.forEach(function(el){
    el.addEventListener("change", function(){
      var path = el.getAttribute("data-bind");
      var val = el.type==="number" ? parseFloat(el.value) : el.value;
      if(path.indexOf("settings.")===0){
        window.updateSetting(path.replace("settings.",""), el.value);
        return;
      }
      setPath(S, path, val);
      if(path==="playerSearchQuery" || path==="playerSortKey" || path==="wishlistSearchQuery"){ render(); return; }
    });
    if(el.tagName==="INPUT" && el.type==="text" && (el.getAttribute("data-bind")==="playerSearchQuery" || el.getAttribute("data-bind")==="wishlistSearchQuery")){
      el.addEventListener("input", function(){
        var p = el.getAttribute("data-bind");
        S[p] = el.value; render(); preserveFocus(el);
      });
    }
  });
}
function preserveFocus(el){
  // no-op placeholder: full re-render loses focus on search input; acceptable tradeoff for simplicity
}

  document.addEventListener("keydown", function(e){
    if(S.screen!=="auction" || !S.currentPlayer || S.flash) return;
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if(tag==="INPUT" || tag==="SELECT" || tag==="TEXTAREA") return;
    if(e.key==="b" || e.key==="B"){ e.preventDefault(); window.userBid(); }
    else if(e.key==="p" || e.key==="P"){ e.preventDefault(); window.userPass(); }
    else if(e.key===" "){ e.preventDefault(); window.togglePause(); }
  });
}
loadActiveAuctionCheck();

})();
</script>
